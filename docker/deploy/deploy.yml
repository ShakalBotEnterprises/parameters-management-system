version: "3.8"

services:
  pms:
    image: ${PMS_IMAGE}:${TAG:-latest}
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: ${PMS_LIMITS_CPU}
          memory: ${PMS_LIMITS_MEM}
        reservations:
          cpus: ${PMS_REQ_CPU}
          memory: ${PMS_REQ_MEM}
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 6
    env_file:
      - .env
    networks:
      - cluster_network
    volumes:
      - pms_server_volume:/volumes/pms-server
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: 1

volumes:
  pms_server_volume:
    name: pms_server_volume
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NFS}/services/pms-server/volumes/pms-server

networks:
  cluster_network:
    external: true
    name: ${CLUSTER_NETWORK}
